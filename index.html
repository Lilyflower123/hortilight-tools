<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HortiLight - 专业测试报告生成器 v6.1</title>
    
    <!-- 样式库 -->
    <link href="https://cdn.staticfile.org/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    
    <!-- 核心库 (添加 crossorigin) -->
    <script src="https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.staticfile.org/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.staticfile.org/babel-standalone/7.22.20/babel.min.js" crossorigin="anonymous"></script>
    
    <style>
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .canvas-card { 
            background: white; border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            overflow: hidden; transition: all 0.3s ease;
            position: relative;
        }
        .canvas-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08); }
        .input-group { @apply flex flex-col gap-2; }
        .input-label { @apply text-sm font-bold text-slate-700; }
        .input-field { @apply border border-slate-300 rounded-lg px-4 py-2 text-base focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition w-full; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, Component } = React;

        // --- Error Boundary ---
        class ErrorBoundary extends Component {
            constructor(props) { super(props); this.state = { hasError: false }; }
            static getDerivedStateFromError(error) { return { hasError: true }; }
            componentDidCatch(error, errorInfo) { console.error(error, errorInfo); }
            render() { if (this.state.hasError) return <div className="p-8 text-center text-red-600">出错了，请刷新页面重试。</div>; return this.props.children; }
        }

        // --- 辅助函数 ---
        const getColor = (ratio) => {
            const rRatio = 0.1 + (ratio * 0.9);
            const start = { r: 255, g: 250, b: 240 };
            const end = { r: 255, g: 140, b: 0 };
            const r = Math.round(start.r + (end.r - start.r) * rRatio);
            const g = Math.round(start.g + (end.g - start.g) * rRatio);
            const b = Math.round(start.b + (end.b - start.b) * rRatio);
            return `rgb(${r}, ${g}, ${b})`;
        };

        // --- 图标组件 ---
        const Icon = ({ name, size = 18, className }) => {
            const paths = {
                upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>,
                download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>,
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {paths[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        // --- 1. 光谱图 ---
        function drawSpectrum(canvas, data, titleStr) {
            if (!canvas || !data || data.length === 0) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width; const h = canvas.height;
            const padding = { top: 40, right: 30, bottom: 70, left: 50 }; 
            const plotW = w - padding.left - padding.right;
            const plotH = h - padding.top - padding.bottom;

            ctx.fillStyle = "white"; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = "#334155"; ctx.font = "16px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(titleStr || "Spectral Analysis", w/2, 25);

            let totalInt = 0;
            let ranges = [
                { name: 'UV', label: 'UV', min: 0, max: 399, sum: 0, color: '#8b00ff', center: 390 },
                { name: 'Blue', label: 'Blue', min: 400, max: 499, sum: 0, color: '#0000ff', center: 450 },
                { name: 'Green', label: 'Green', min: 500, max: 599, sum: 0, color: '#008000', center: 550 },
                { name: 'Red', label: 'Red', min: 600, max: 699, sum: 0, color: '#ff0000', center: 650 },
                { name: 'IR', label: 'IR', min: 700, max: 1000, sum: 0, color: '#8b0000', center: 740 }
            ];

            const maxInt = Math.max(...data.map(d => {
                totalInt += d.intensity;
                const wl = d.wl;
                const range = ranges.find(r => wl >= r.min && wl <= r.max);
                if (range) range.sum += d.intensity;
                return d.intensity;
            }));
            const normData = data.map(d => ({ ...d, val: d.intensity / (maxInt || 1) }));

            const grad = ctx.createLinearGradient(padding.left, 0, padding.left + plotW, 0);
            grad.addColorStop(0, "#8b00ff"); grad.addColorStop(0.25, "#0000ff");
            grad.addColorStop(0.45, "#00ff00"); grad.addColorStop(0.6, "#ffff00");
            grad.addColorStop(0.8, "#ff0000"); grad.addColorStop(1, "#8b0000");

            ctx.beginPath(); ctx.moveTo(padding.left, h - padding.bottom);
            normData.forEach(d => {
                if(d.wl < 380 || d.wl > 780) return;
                const x = padding.left + ((d.wl - 380) / 400) * plotW;
                const y = (h - padding.bottom) - (d.val * plotH);
                ctx.lineTo(x, y);
            });
            ctx.lineTo(w - padding.right, h - padding.bottom);
            ctx.closePath(); ctx.fillStyle = grad; ctx.fill();

            ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1;
            ctx.strokeRect(padding.left, padding.top, plotW, plotH);
            
            ctx.fillStyle = "#94a3b8"; ctx.font = "10px sans-serif"; ctx.textAlign = "center";
            [380, 480, 580, 680, 780].forEach(wl => {
                const x = padding.left + ((wl - 380) / 400) * plotW;
                ctx.fillText(wl, x, h - padding.bottom + 15);
                ctx.beginPath(); ctx.moveTo(x, h - padding.bottom); ctx.lineTo(x, h - padding.bottom + 4); ctx.stroke();
            });

            const dataY = h - 20;
            const safeTotal = totalInt || 1;
            ranges.forEach(r => {
                if (r.center < 380 || r.center > 780 && r.name !== 'IR' && r.name !== 'UV') return;
                let x = padding.left + ((r.center - 380) / 400) * plotW;
                if(x < padding.left) x = padding.left + 10;
                if(x > w - padding.right) x = w - padding.right - 10;

                const pct = ((r.sum / safeTotal) * 100).toFixed(1) + "%";
                ctx.fillStyle = r.color; ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(r.label, x, dataY - 12);
                ctx.fillStyle = "#334155"; ctx.font = "11px sans-serif";
                ctx.fillText(pct, x, dataY);
            });
        }

        // --- 2. PPFD 热力图 ---
        function drawHeatmap(canvas, grid, title) {
            if (!canvas || !grid || grid.length === 0) return;
            const ctx = canvas.getContext('2d');
            const rows = grid.length;
            const cols = grid[0].length;
            const cellSize = 70;
            const padding = { top: 50, right: 40, bottom: 40, left: 50 };
            
            const targetW = padding.left + padding.right + ((cols - 1) * cellSize);
            const targetH = padding.top + padding.bottom + ((rows - 1) * cellSize);
            canvas.width = targetW;
            canvas.height = targetH;
            
            ctx.fillStyle = "white"; ctx.fillRect(0, 0, targetW, targetH);
            // 标题更优雅: 14px, 深灰
            ctx.fillStyle = "#475569"; ctx.font = "14px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(title, targetW/2, 25);

            const flat = grid.flat();
            const minVal = Math.min(...flat);
            const maxVal = Math.max(...flat);
            const valRange = maxVal - minVal || 1;
            const startX = padding.left;
            const startY = padding.top;
            const subDiv = 10; 

            // 平滑背景
            for (let r = 0; r < rows - 1; r++) {
                for (let c = 0; c < cols - 1; c++) {
                    const vTL = grid[r][c];
                    const vTR = grid[r][c+1];
                    const vBL = grid[r+1][c];
                    const vBR = grid[r+1][c+1];
                    for (let sy = 0; sy < subDiv; sy++) {
                        for (let sx = 0; sx < subDiv; sx++) {
                            const py = sy / subDiv;
                            const px = sx / subDiv;
                            const val = (1-px)*(1-py)*vTL + px*(1-py)*vTR + (1-px)*py*vBL + px*py*vBR;
                            const ratio = (val - minVal) / valRange;
                            ctx.fillStyle = getColor(ratio);
                            const cellX = startX + c * cellSize;
                            const cellY = startY + r * cellSize;
                            ctx.fillRect(cellX + (sx * cellSize/subDiv), cellY + (sy * cellSize/subDiv), (cellSize/subDiv)+0.5, (cellSize/subDiv)+0.5);
                        }
                    }
                }
            }

            // 极细网格线
            ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 0.5;
            for (let c = 0; c < cols; c++) {
                const x = startX + c * cellSize;
                ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, startY + (rows-1)*cellSize); ctx.stroke();
            }
            for (let r = 0; r < rows; r++) {
                const y = startY + r * cellSize;
                ctx.beginPath(); ctx.moveTo(startX, y); ctx.lineTo(startX + (cols-1)*cellSize, y); ctx.stroke();
            }

            // 细边框
            ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1; 
            ctx.strokeRect(startX, startY, (cols-1)*cellSize, (rows-1)*cellSize);

            // 交叉点数值 (不加粗, 小字号)
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const val = grid[r][c];
                    const x = startX + c * cellSize;
                    const y = startY + r * cellSize;
                    ctx.font = "9px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 2; 
                    ctx.strokeText(val.toFixed(2), x, y);
                    ctx.fillStyle = "#334155";
                    ctx.fillText(val.toFixed(2), x, y);
                }
            }
        }

        // --- 3. 锥形图 (支持单位显示) ---
        function drawCone(canvas, data, titleStr) {
            if (!canvas || !data || !data.heights || data.heights.length < 4) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width; const h = canvas.height;
            
            ctx.fillStyle = "white"; ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = "#334155"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(titleStr || "Cone Diagram", w/2, 25);

            // 计算绘图用的高度 (cm)
            const cmHeights = data.heights;
            // 获取原始输入高度和单位
            const rawHeights = data.rawHeights;
            const unit = data.unit;

            // 推算强度 (使用 H2)
            const h2_cm = cmHeights[1];
            const v2 = (data.vals && data.vals.length > 1) ? data.vals[1] : 0;
            const k = v2 * (h2_cm * h2_cm); 
            
            const fullVals = [
                (data.vals && data.vals.length > 0) ? data.vals[0] : 0,
                v2,
                cmHeights[2] > 0 ? k / Math.pow(cmHeights[2], 2) : 0, 
                cmHeights[3] > 0 ? k / Math.pow(cmHeights[3], 2) : 0
            ];

            const centerX = w / 2;
            const topY = 60;
            const bottomY = h - 40;
            const availH = bottomY - topY;
            const maxH = Math.max(...cmHeights) || 100;
            const scaleY = availH / (maxH * 1.15); 

            ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(centerX, topY); ctx.lineTo(centerX, bottomY); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = "#fbbf24"; 
            ctx.beginPath(); ctx.arc(centerX, topY, 6, 0, Math.PI*2); ctx.fill();

            const maxVal = Math.max(...fullVals) || 1;
            cmHeights.forEach((h_cm, i) => {
                const val = fullVals[i];
                const y = topY + (h_cm * scaleY);
                const radius = Math.abs(h_cm * scaleY * 0.55); 
                const opacity = 0.2 + (val / maxVal) * 0.6;
                const ratio = val / maxVal;
                
                ctx.beginPath();
                ctx.ellipse(centerX, y, radius, radius * 0.25, 0, 0, Math.PI * 2);
                ctx.fillStyle = getColor(ratio).replace(')', `, ${opacity})`).replace('rgb', 'rgba');
                ctx.fill();
                ctx.strokeStyle = "rgba(234, 88, 12, 0.5)"; ctx.lineWidth = 1; ctx.stroke();

                ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1;
                
                // --- 标签显示：原始单位 / cm ---
                // 例如: "36 in / 91 cm"
                const rawH = rawHeights[i];
                const labelH = `${rawH} ${unit} / ${Math.round(h_cm)} cm`;
                
                ctx.beginPath(); ctx.moveTo(centerX - radius, y); ctx.lineTo(centerX - radius - 30, y); ctx.stroke();
                ctx.fillStyle = "#475569"; ctx.font = "11px sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
                ctx.fillText(labelH, centerX - radius - 35, y);

                const labelV = `${val.toFixed(2)} µmol/s/m²`;
                ctx.beginPath(); ctx.moveTo(centerX + radius, y); ctx.lineTo(centerX + radius + 30, y); ctx.stroke();
                ctx.textAlign = "left"; ctx.font = "bold 11px sans-serif";
                ctx.fillText(labelV, centerX + radius + 35, y);
            });
        }

        // --- 主程序 ---
        function App() {
            const [file, setFile] = useState(null);
            const [modelName, setModelName] = useState("Model-X"); 
            const [status, setStatus] = useState("");
            const [chartData, setChartData] = useState(null);

            const specRef = useRef(null);
            const ppfdH1Ref = useRef(null);
            const ppfdH2Ref = useRef(null);
            const coneRef = useRef(null);

            const handleFile = (f) => {
                if(!f) return;
                setFile(f);
                setStatus("正在解析...");
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const wb = XLSX.read(data, {type:'array'});
                        
                        // 1. 查找目标 Sheet
                        let targetSheetName = wb.SheetNames.find(n => n.trim() === "PPFD测试方法第一版");
                        if (!targetSheetName) targetSheetName = wb.SheetNames.find(n => n.includes("PPFD"));
                        if (!targetSheetName) targetSheetName = wb.SheetNames[0];

                        const targetSheet = wb.Sheets[targetSheetName];
                        const sheetRaw = XLSX.utils.sheet_to_json(targetSheet, {header: 1});
                        
                        // 2. 读取单位 (C2) - 0-indexed: Row 1, Col 2
                        let unitStr = "in"; // 默认
                        let multiplier = 2.54; // 默认英寸
                        
                        // 安全读取 C2
                        const c2Cell = targetSheet['C2'];
                        if (c2Cell && c2Cell.v) {
                            const val = c2Cell.v.toString().toLowerCase();
                            if (val.includes('ft') || val.includes('feet') || val.includes('英尺')) {
                                unitStr = "ft";
                                multiplier = 30.48;
                            }
                        }

                        // 3. 读取高度数值 (D2, E2, F2, G2)
                        const getVal = (addr) => {
                            const cell = targetSheet[addr];
                            return cell ? parseFloat(cell.v) : NaN;
                        };

                        const h1_raw = getVal('D2');
                        const h2_raw = getVal('E2');
                        const h3_raw = getVal('F2');
                        const h4_raw = getVal('G2');

                        if (isNaN(h1_raw) && isNaN(h2_raw)) {
                            // 虽然这里可能报错，但为防止崩溃，给默认值
                            console.warn("未能读取到 D2/E2 数据，使用默认值");
                        }

                        // 逻辑处理：如果有值则转换，无值则默认/推算
                        // 为了界面显示，我们需要保留 "原始输入值" (raw) 和 "计算用的cm值" (cm)
                        let raw1 = !isNaN(h1_raw) ? h1_raw : (unitStr === 'ft' ? 1 : 12); 
                        let raw2 = !isNaN(h2_raw) ? h2_raw : (unitStr === 'ft' ? 2 : 24);
                        
                        const step = raw2 - raw1;
                        let raw3 = !isNaN(h3_raw) ? h3_raw : raw2 + step;
                        let raw4 = !isNaN(h4_raw) ? h4_raw : raw3 + step;
                        
                        // 负值归零
                        if (raw3 < 0) raw3 = 0;
                        if (raw4 < 0) raw4 = 0;

                        // 转换为 cm 用于绘图和物理计算
                        const h1_cm = raw1 * multiplier;
                        const h2_cm = raw2 * multiplier;
                        const h3_cm = raw3 * multiplier;
                        const h4_cm = raw4 * multiplier;

                        // 4. 光谱数据
                        let specData = [];
                        const specSheetName = wb.SheetNames.find(n => n.includes("光谱"));
                        if (specSheetName) {
                            specData = XLSX.utils.sheet_to_json(wb.Sheets[specSheetName]).map(row => ({
                                wl: row['波长(nm)'], intensity: row['相对光谱']
                            })).filter(d => d.wl);
                        } else {
                            const firstSheet = wb.Sheets[wb.SheetNames[0]];
                             specData = XLSX.utils.sheet_to_json(firstSheet).map(row => ({
                                wl: row['波长(nm)'], intensity: row['相对光谱']
                            })).filter(d => d.wl);
                        }

                        // 5. PPFD Grid
                        const ppfdRaw = XLSX.utils.sheet_to_json(targetSheet, {header:1});
                        let startRow = -1;
                        for(let i=0; i<ppfdRaw.length; i++) {
                            if(JSON.stringify(ppfdRaw[i]).includes("A1")) { startRow = i; break; }
                        }
                        
                        if(startRow === -1) throw new Error("未找到 A1 数据标记");

                        const points = [];
                        let maxR = 0, maxC = 0;
                        for(let i=startRow; i<ppfdRaw.length; i++) {
                            const row = ppfdRaw[i];
                            if(typeof row[2] === 'string' && row[2].match(/^[A-Z]\d+$/)) {
                                const r = row[2].charCodeAt(0) - 65;
                                const c = parseInt(row[2].slice(1)) - 1;
                                if(r>maxR) maxR=r; if(c>maxC) maxC=c;
                                points.push({ r, c, h1: parseFloat(row[3]), h2: parseFloat(row[4]) });
                            }
                        }

                        const rows = maxR + 1;
                        const cols = maxC + 1;
                        const gridH1 = Array(rows).fill().map(() => Array(cols).fill(0));
                        const gridH2 = Array(rows).fill().map(() => Array(cols).fill(0));
                        points.forEach(p => {
                            if(p.r < rows && p.c < cols) {
                                gridH1[p.r][p.c] = p.h1 || 0;
                                gridH2[p.r][p.c] = p.h2 || 0;
                            }
                        });

                        const cR = Math.floor(rows/2);
                        const cC = Math.floor(cols/2);
                        const val1 = gridH1[cR][cC];
                        const val2 = gridH2[cR][cC];

                        setChartData({
                            spec: specData,
                            h1: { grid: gridH1, height_cm: h1_cm, raw: raw1 },
                            h2: { grid: gridH2, height_cm: h2_cm, raw: raw2 },
                            cone: { 
                                heights: [h1_cm, h2_cm, h3_cm, h4_cm], // cm用于绘图
                                rawHeights: [raw1, raw2, raw3, raw4], // raw用于显示
                                unit: unitStr,
                                vals: [val1, val2] 
                            }
                        });
                        
                        setStatus(`解析成功! 模式: ${unitStr}`);
                    } catch(e) {
                        console.error(e);
                        setStatus("错误: " + e.message);
                    }
                };
                reader.readAsArrayBuffer(f);
            };

            useEffect(() => {
                if(chartData) {
                    try {
                        const unit = chartData.cone.unit;
                        drawSpectrum(specRef.current, chartData.spec, `${modelName} - Spectrum`);
                        
                        // 标题带双单位
                        const t1 = `${modelName} - PPFD @ ${chartData.h1.raw} ${unit} / ${Math.round(chartData.h1.height_cm)} cm`;
                        const t2 = `${modelName} - PPFD @ ${chartData.h2.raw} ${unit} / ${Math.round(chartData.h2.height_cm)} cm`;
                        
                        drawHeatmap(ppfdH1Ref.current, chartData.h1.grid, t1);
                        drawHeatmap(ppfdH2Ref.current, chartData.h2.grid, t2);
                        drawCone(coneRef.current, chartData.cone, `${modelName} - Light Cone`);
                    } catch(err) {
                        console.error(err);
                    }
                }
            }, [chartData, modelName]);

            const download = (ref, suffix) => {
                if (!ref.current) return;
                try {
                    const link = document.createElement('a');
                    link.download = `${modelName}_${suffix}.png`;
                    link.href = ref.current.toDataURL();
                    link.click();
                } catch(e) { alert("下载失败"); }
            };

            return (
                <div className="max-w-7xl mx-auto p-6">
                    <header className="mb-8 bg-white p-6 rounded-xl shadow-sm flex flex-col md:flex-row justify-between items-center gap-6">
                        <div>
                            <h1 className="text-2xl font-bold text-slate-800">HortiLight 报告生成器 v6.1</h1>
                            <p className="text-sm text-slate-500 mt-1">C2单位识别 / 双单位显示 / 界面优化</p>
                            {status && <p className={`text-sm mt-2 font-medium ${status.includes('错误') ? 'text-red-600' : 'text-blue-600'}`}>{status}</p>}
                        </div>
                        <div className="flex gap-4 w-full md:w-auto items-end">
                            <div className="input-group flex-grow">
                                <label className="input-label text-blue-800">产品型号</label>
                                <input type="text" value={modelName} onChange={e => setModelName(e.target.value)} className="input-field border-2 border-blue-100 bg-blue-50 text-lg font-bold text-blue-900 placeholder-blue-300" placeholder="e.g. GL-600W" />
                            </div>
                            <div className="relative">
                                <input type="file" onChange={e => handleFile(e.target.files[0])} className="hidden" id="upload" />
                                <label htmlFor="upload" className="cursor-pointer bg-blue-600 text-white h-[46px] px-6 rounded-lg font-medium hover:bg-blue-700 transition flex items-center justify-center gap-2 shadow-md hover:shadow-lg whitespace-nowrap">
                                    <Icon name="upload" className="w-5 h-5"/> 上传 Excel
                                </label>
                            </div>
                        </div>
                    </header>

                    {chartData && (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="canvas-card p-4">
                                <div className="flex justify-between items-center mb-2 px-2">
                                    <h3 className="text-sm font-bold text-slate-700 uppercase">Spectrum Analysis</h3>
                                    <button onClick={() => download(specRef, 'Spectrum')} className="text-slate-400 hover:text-blue-600 p-1"><Icon name="download"/></button>
                                </div>
                                <canvas ref={specRef} width={600} height={400} className="w-full h-auto"/>
                            </div>
                            <div className="canvas-card p-4">
                                <div className="flex justify-between items-center mb-2 px-2">
                                    <h3 className="text-sm font-bold text-slate-700 uppercase">Light Cone</h3>
                                    <button onClick={() => download(coneRef, 'Cone')} className="text-slate-400 hover:text-blue-600 p-1"><Icon name="download"/></button>
                                </div>
                                <canvas ref={coneRef} width={600} height={500} className="w-full h-auto"/>
                            </div>
                            <div className="canvas-card p-4">
                                <div className="flex justify-between items-center mb-2 px-2">
                                    <h3 className="text-sm font-bold text-slate-700 uppercase">PPFD Map (H1)</h3>
                                    <button onClick={() => download(ppfdH1Ref, `PPFD_${Math.round(chartData.h1.height_cm)}cm`)} className="text-slate-400 hover:text-blue-600 p-1"><Icon name="download"/></button>
                                </div>
                                <canvas ref={ppfdH1Ref} className="w-full h-auto border border-slate-100 rounded"/>
                            </div>
                            <div className="canvas-card p-4">
                                <div className="flex justify-between items-center mb-2 px-2">
                                    <h3 className="text-sm font-bold text-slate-700 uppercase">PPFD Map (H2)</h3>
                                    <button onClick={() => download(ppfdH2Ref, `PPFD_${Math.round(chartData.h2.height_cm)}cm`)} className="text-slate-400 hover:text-blue-600 p-1"><Icon name="download"/></button>
                                </div>
                                <canvas ref={ppfdH2Ref} className="w-full h-auto border border-slate-100 rounded"/>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
