<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HortiLight - 专业测试报告生成器 v4.2</title>
    
    <!-- 样式库 -->
    <link href="https://cdn.staticfile.org/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    
    <!-- 核心库 -->
    <script src="https://cdn.staticfile.org/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.staticfile.org/react/18.2.0/umd/react.development.js"></script>
    <script src="https://cdn.staticfile.org/react-dom/18.2.0/umd/react-dom.development.js"></script>
    <script src="https://cdn.staticfile.org/babel-standalone/7.22.20/babel.min.js"></script>
    
    <style>
        body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
        .canvas-card { 
            background: white; border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            overflow: hidden; transition: all 0.3s ease;
            position: relative;
        }
        .canvas-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.08); }
        .input-group { @apply flex flex-col gap-2; }
        .input-label { @apply text-sm font-bold text-slate-700; }
        .input-field { @apply border border-slate-300 rounded-lg px-4 py-2 text-base focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition w-full; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 辅助函数 ---
        // 颜色插值 (纯橙色系: 从 极浅橙 到 鲜亮橙)
        const getColor = (ratio) => {
            // ratio 0 ~ 1
            const rRatio = 0.1 + (ratio * 0.9);
            const start = { r: 255, g: 250, b: 240 };
            const end = { r: 255, g: 140, b: 0 };
            const r = Math.round(start.r + (end.r - start.r) * rRatio);
            const g = Math.round(start.g + (end.g - start.g) * rRatio);
            const b = Math.round(start.b + (end.b - start.b) * rRatio);
            return `rgb(${r}, ${g}, ${b})`;
        };

        const cmToFt = (cm) => (cm / 30.48).toFixed(1);

        // --- 图标组件 ---
        const Icon = ({ name, size = 18, className }) => {
            const paths = {
                upload: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>,
                download: <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>,
                copy: <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>,
                chart: <path d="M12 20V10M18 20V4M6 20v-6"/>,
            };
            return (
                <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {paths[name]}
                </svg>
            );
        };

        // --- 1. 光谱图绘制 (百分比在底部) ---
        function drawSpectrum(canvas, data, titleStr) {
            if (!canvas || !data || data.length === 0) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width; const h = canvas.height;
            // 底部留更多空间给百分比数据
            const padding = { top: 40, right: 30, bottom: 70, left: 50 }; 
            const plotW = w - padding.left - padding.right;
            const plotH = h - padding.top - padding.bottom;

            ctx.fillStyle = "white"; ctx.fillRect(0, 0, w, h);
            
            // 标题
            ctx.fillStyle = "#334155"; ctx.font = "16px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(titleStr || "Spectral Analysis", w/2, 25);

            // --- 计算占比 ---
            let totalInt = 0;
            // 为了保持顺序，使用数组
            let ranges = [
                { name: 'UV', label: 'UV', min: 0, max: 399, sum: 0, color: '#8b00ff', center: 390 },
                { name: 'Blue', label: 'Blue', min: 400, max: 499, sum: 0, color: '#0000ff', center: 450 },
                { name: 'Green', label: 'Green', min: 500, max: 599, sum: 0, color: '#008000', center: 550 },
                { name: 'Red', label: 'Red', min: 600, max: 699, sum: 0, color: '#ff0000', center: 650 },
                { name: 'IR', label: 'IR', min: 700, max: 1000, sum: 0, color: '#8b0000', center: 740 }
            ];

            const maxInt = Math.max(...data.map(d => {
                totalInt += d.intensity;
                const wl = d.wl;
                const range = ranges.find(r => wl >= r.min && wl <= r.max);
                if (range) range.sum += d.intensity;
                return d.intensity;
            }));
            const normData = data.map(d => ({ ...d, val: d.intensity / maxInt }));

            // --- 绘制图表 ---
            // 渐变填充
            const grad = ctx.createLinearGradient(padding.left, 0, padding.left + plotW, 0);
            grad.addColorStop(0, "#8b00ff"); grad.addColorStop(0.25, "#0000ff");
            grad.addColorStop(0.45, "#00ff00"); grad.addColorStop(0.6, "#ffff00");
            grad.addColorStop(0.8, "#ff0000"); grad.addColorStop(1, "#8b0000");

            ctx.beginPath(); ctx.moveTo(padding.left, h - padding.bottom);
            normData.forEach(d => {
                if(d.wl < 380 || d.wl > 780) return;
                const x = padding.left + ((d.wl - 380) / 400) * plotW;
                const y = (h - padding.bottom) - (d.val * plotH);
                ctx.lineTo(x, y);
            });
            ctx.lineTo(w - padding.right, h - padding.bottom);
            ctx.closePath(); ctx.fillStyle = grad; ctx.fill();

            // 边框
            ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1;
            ctx.strokeRect(padding.left, padding.top, plotW, plotH);
            
            // X轴刻度 (波长)
            ctx.fillStyle = "#94a3b8"; ctx.font = "10px sans-serif"; ctx.textAlign = "center";
            [380, 480, 580, 680, 780].forEach(wl => {
                const x = padding.left + ((wl - 380) / 400) * plotW;
                ctx.fillText(wl, x, h - padding.bottom + 15);
                // 小刻度线
                ctx.beginPath(); ctx.moveTo(x, h - padding.bottom); ctx.lineTo(x, h - padding.bottom + 4); ctx.stroke();
            });

            // --- 底部百分比数据 ---
            const dataY = h - 20;
            ranges.forEach(r => {
                if (r.center < 380 || r.center > 780 && r.name !== 'IR' && r.name !== 'UV') return; // 简单边界检查
                
                // 计算 x 位置
                let x = padding.left + ((r.center - 380) / 400) * plotW;
                // 边界修正
                if(x < padding.left) x = padding.left + 10;
                if(x > w - padding.right) x = w - padding.right - 10;

                const pct = ((r.sum / totalInt) * 100).toFixed(1) + "%";
                
                // 绘制名称
                ctx.fillStyle = r.color;
                ctx.font = "bold 11px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText(r.label, x, dataY - 12);
                
                // 绘制数值
                ctx.fillStyle = "#334155";
                ctx.font = "11px sans-serif";
                ctx.fillText(pct, x, dataY);
            });
        }

        // --- 2. PPFD 热力图 (优雅简洁版) ---
        function drawHeatmap(canvas, grid, title) {
            if (!canvas || !grid || grid.length === 0) return;
            const ctx = canvas.getContext('2d');
            
            const rows = grid.length;
            const cols = grid[0].length;
            const cellSize = 70;
            const padding = { top: 50, right: 40, bottom: 40, left: 50 };
            
            const targetW = padding.left + padding.right + ((cols - 1) * cellSize);
            const targetH = padding.top + padding.bottom + ((rows - 1) * cellSize);
            canvas.width = targetW;
            canvas.height = targetH;
            
            ctx.fillStyle = "white"; ctx.fillRect(0, 0, targetW, targetH);

            // 标题优化: 14px, 正常粗细, 颜色淡一点
            ctx.fillStyle = "#475569"; ctx.font = "14px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(title, targetW/2, 25);

            const flat = grid.flat();
            const minVal = Math.min(...flat);
            const maxVal = Math.max(...flat);
            const valRange = maxVal - minVal || 1;

            const startX = padding.left;
            const startY = padding.top;

            // --- A. 绘制平滑渐变背景 ---
            const subDiv = 10; 
            for (let r = 0; r < rows - 1; r++) {
                for (let c = 0; c < cols - 1; c++) {
                    const vTL = grid[r][c];
                    const vTR = grid[r][c+1];
                    const vBL = grid[r+1][c];
                    const vBR = grid[r+1][c+1];

                    for (let sy = 0; sy < subDiv; sy++) {
                        for (let sx = 0; sx < subDiv; sx++) {
                            const py = sy / subDiv;
                            const px = sx / subDiv;
                            const val = (1-px)*(1-py)*vTL + px*(1-py)*vTR + (1-px)*py*vBL + px*py*vBR;
                            
                            const ratio = (val - minVal) / valRange;
                            ctx.fillStyle = getColor(ratio);
                            
                            const cellX = startX + c * cellSize;
                            const cellY = startY + r * cellSize;
                            ctx.fillRect(
                                cellX + (sx * cellSize / subDiv), 
                                cellY + (sy * cellSize / subDiv), 
                                (cellSize / subDiv) + 0.5, 
                                (cellSize / subDiv) + 0.5
                            );
                        }
                    }
                }
            }

            // --- B. 绘制网格线 (变细, 优雅) ---
            ctx.strokeStyle = "rgba(255,255,255,0.5)"; 
            ctx.lineWidth = 0.5; // 极细网格线
            
            // 垂直线
            for (let c = 0; c < cols; c++) {
                const x = startX + c * cellSize;
                ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, startY + (rows-1)*cellSize); ctx.stroke();
            }
            // 水平线
            for (let r = 0; r < rows; r++) {
                const y = startY + r * cellSize;
                ctx.beginPath(); ctx.moveTo(startX, y); ctx.lineTo(startX + (cols-1)*cellSize, y); ctx.stroke();
            }

            // 外框 (变细)
            ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1; 
            ctx.strokeRect(startX, startY, (cols-1)*cellSize, (rows-1)*cellSize);

            // --- C. 绘制交叉点数值 (缩小, 不加粗) ---
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const val = grid[r][c];
                    const x = startX + c * cellSize;
                    const y = startY + r * cellSize;
                    
                    // 样式优化: 9px, 非粗体
                    ctx.font = "9px Arial";
                    ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    
                    // 减弱光晕: 更细, 透明度更高
                    ctx.strokeStyle = "rgba(255,255,255,0.7)";
                    ctx.lineWidth = 2; 
                    ctx.strokeText(val.toFixed(2), x, y);
                    
                    ctx.fillStyle = "#334155"; // 稍微深灰一点，不完全黑，更有质感
                    ctx.fillText(val.toFixed(2), x, y);
                }
            }
        }

        // --- 3. 锥形图 (4个高度推算) ---
        function drawCone(canvas, data, titleStr) {
            if (!canvas || !data || data.heights.length < 2) return;
            const ctx = canvas.getContext('2d');
            const w = canvas.width; const h = canvas.height;
            
            ctx.fillStyle = "white"; ctx.fillRect(0, 0, w, h);
            
            ctx.fillStyle = "#334155"; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(titleStr || "Cone Diagram", w/2, 25);

            // 1. 数据准备
            const h1 = data.heights[0];
            const h2 = data.heights[1];
            const step = h2 - h1;
            
            const fullHeights = [h1, h2, h2 + step, h2 + step * 2];
            const v2 = data.vals[1];
            const k = v2 * (h2 * h2); 
            
            const fullVals = [
                data.vals[0],
                data.vals[1],
                k / Math.pow(fullHeights[2], 2),
                k / Math.pow(fullHeights[3], 2)
            ];

            const centerX = w / 2;
            const topY = 60;
            const bottomY = h - 40;
            const availH = bottomY - topY;

            const maxH = fullHeights[3];
            const scaleY = availH / (maxH * 1.15); 

            // 2. 轴线
            ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1; ctx.setLineDash([5, 5]);
            ctx.beginPath(); ctx.moveTo(centerX, topY); ctx.lineTo(centerX, bottomY); ctx.stroke();
            ctx.setLineDash([]);

            // 3. 灯源
            ctx.fillStyle = "#fbbf24"; 
            ctx.beginPath(); ctx.arc(centerX, topY, 6, 0, Math.PI*2); ctx.fill();

            // 4. 绘制光斑 (4层)
            const maxVal = Math.max(...fullVals);
            
            fullHeights.forEach((height, i) => {
                const val = fullVals[i];
                const y = topY + (height * scaleY);
                const radius = height * scaleY * 0.55; 
                
                // 颜色 (使用新的橙色逻辑)
                const opacity = 0.2 + (val / maxVal) * 0.6;
                const ratio = val / maxVal;
                
                ctx.beginPath();
                ctx.ellipse(centerX, y, radius, radius * 0.25, 0, 0, Math.PI * 2);
                ctx.fillStyle = getColor(ratio).replace(')', `, ${opacity})`).replace('rgb', 'rgba');
                ctx.fill();
                ctx.strokeStyle = "rgba(234, 88, 12, 0.5)";
                ctx.lineWidth = 1; ctx.stroke();

                // 标注线
                ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 1;
                
                // 左侧: 高度
                const labelH = `${cmToFt(height)}ft / ${Math.round(height)}cm`;
                ctx.beginPath(); ctx.moveTo(centerX - radius, y); ctx.lineTo(centerX - radius - 30, y); ctx.stroke();
                ctx.fillStyle = "#475569"; ctx.font = "11px sans-serif"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
                ctx.fillText(labelH, centerX - radius - 35, y);

                // 右侧: 数值
                const labelV = `${val.toFixed(2)} µmol/s/m²`;
                ctx.beginPath(); ctx.moveTo(centerX + radius, y); ctx.lineTo(centerX + radius + 30, y); ctx.stroke();
                ctx.textAlign = "left";
                ctx.font = "bold 11px sans-serif";
                ctx.fillText(labelV, centerX + radius + 35, y);
            });
        }

        // --- 主程序 ---
        function App() {
            const [file, setFile] = useState(null);
            const [modelName, setModelName] = useState("Model-X"); 
            const [status, setStatus] = useState("");
            const [chartData, setChartData] = useState(null);

            const specRef = useRef(null);
            const ppfdH1Ref = useRef(null);
            const ppfdH2Ref = useRef(null);
            const coneRef = useRef(null);

            const handleFile = (f) => {
                if(!f) return;
                setFile(f);
                setStatus("正在解析...");
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const wb = XLSX.read(data, {type:'array'});
                        
                        // 1. 读取 Sheet1
                        const sheet1 = XLSX.utils.sheet_to_json(wb.Sheets['Sheet1'] || wb.Sheets[wb.SheetNames[0]]);
                        const metaRow = sheet1[0] || {}; 
                        const h1_cm = parseFloat(metaRow['H1_cm'] || 30);
                        const h2_cm = parseFloat(metaRow['H2_cm'] || 60);

                        // 2. 光谱
                        let specData = [];
                        if (wb.Sheets['光谱']) {
                            specData = XLSX.utils.sheet_to_json(wb.Sheets['光谱']).map(row => ({
                                wl: row['波长(nm)'], intensity: row['相对光谱']
                            })).filter(d => d.wl);
                        }

                        // 3. PPFD Grid
                        const ppfdSheetName = wb.SheetNames.find(n => n.includes("PPFD"));
                        if (!ppfdSheetName) throw new Error("缺少 PPFD 工作表");
                        const ppfdRaw = XLSX.utils.sheet_to_json(wb.Sheets[ppfdSheetName], {header:1});
                        
                        let startRow = -1;
                        for(let i=0; i<ppfdRaw.length; i++) {
                            if(JSON.stringify(ppfdRaw[i]).includes("A1")) { startRow = i; break; }
                        }
                        if(startRow === -1) throw new Error("未找到 A1 测试数据");

                        const points = [];
                        let maxR = 0, maxC = 0;
                        for(let i=startRow; i<ppfdRaw.length; i++) {
                            const row = ppfdRaw[i];
                            if(typeof row[2] === 'string' && row[2].match(/^[A-Z]\d+$/)) {
                                const r = row[2].charCodeAt(0) - 65;
                                const c = parseInt(row[2].slice(1)) - 1;
                                if(r>maxR) maxR=r; if(c>maxC) maxC=c;
                                points.push({ r, c, h1: parseFloat(row[3]), h2: parseFloat(row[4]) });
                            }
                        }

                        const rows = maxR + 1;
                        const cols = maxC + 1;
                        const gridH1 = Array(rows).fill().map(() => Array(cols).fill(0));
                        const gridH2 = Array(rows).fill().map(() => Array(cols).fill(0));
                        points.forEach(p => {
                            if(p.r < rows && p.c < cols) {
                                gridH1[p.r][p.c] = p.h1 || 0;
                                gridH2[p.r][p.c] = p.h2 || 0;
                            }
                        });

                        const cR = Math.floor(rows/2);
                        const cC = Math.floor(cols/2);
                        const val1 = gridH1[cR][cC];
                        const val2 = gridH2[cR][cC];

                        setChartData({
                            spec: specData,
                            h1: { grid: gridH1, height: h1_cm },
                            h2: { grid: gridH2, height: h2_cm },
                            cone: { heights: [h1_cm, h2_cm], vals: [val1, val2] }
                        });
                        setStatus("解析成功");
                    } catch(e) {
                        console.error(e);
                        setStatus("错误: " + e.message);
                    }
                };
                reader.readAsArrayBuffer(f);
            };

            useEffect(() => {
                if(chartData) {
                    drawSpectrum(specRef.current, chartData.spec, `${modelName} - Spectrum`);
                    drawHeatmap(ppfdH1Ref.current, chartData.h1.grid, `${modelName} - PPFD @ ${chartData.h1.height}cm`);
                    drawHeatmap(ppfdH2Ref.current, chartData.h2.grid, `${modelName} - PPFD @ ${chartData.h2.height}cm`);
                    drawCone(coneRef.current, chartData.cone, `${modelName} - Light Cone`);
                }
            }, [chartData, modelName]);

            const download = (ref, suffix) => {
                if (!ref.current) return;
                const link = document.createElement('a');
                link.download = `${modelName}_${suffix}.png`;
                link.href = ref.current.toDataURL();
                link.click();
            };

            return (
                <div className="max-w-7xl mx-auto p-6">
                    {/* Header: 型号输入移到最上方显眼位置 */}
                    <header className="mb-8 bg-white p-6 rounded-xl shadow-sm">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6">
                            
                            {/* 左侧：标题与状态 */}
                            <div>
                                <h1 className="text-2xl font-bold text-slate-800">HortiLight 报告生成器 v4.2</h1>
                                <p className="text-sm text-slate-500 mt-1">智能插值热力图 / 光谱占比分析 / 锥形图自动推算</p>
                                {status && <p className="text-sm text-blue-600 mt-2 font-medium">{status}</p>}
                            </div>

                            {/* 右侧：操作区 */}
                            <div className="flex flex-col sm:flex-row gap-4 w-full md:w-auto items-stretch sm:items-end">
                                {/* 型号输入 - 显眼样式 */}
                                <div className="input-group flex-grow">
                                    <label className="input-label text-blue-800">产品型号 (Model Name)</label>
                                    <input 
                                        type="text" 
                                        value={modelName} 
                                        onChange={e => setModelName(e.target.value)} 
                                        className="input-field border-2 border-blue-100 bg-blue-50 text-lg font-bold text-blue-900 placeholder-blue-300"
                                        placeholder="请输入型号 e.g. GL-600W"
                                    />
                                </div>
                                
                                {/* 上传按钮 */}
                                <div className="relative">
                                    <input type="file" onChange={e => handleFile(e.target.files[0])} className="hidden" id="upload" />
                                    <label htmlFor="upload" className="cursor-pointer bg-blue-600 text-white h-[46px] px-6 rounded-lg font-medium hover:bg-blue-700 transition flex items-center justify-center gap-2 shadow-md hover:shadow-lg whitespace-nowrap">
                                        <Icon name="upload" className="w-5 h-5"/> 上传 Excel
                                    </label>
                                </div>
                            </div>
                        </div>
                    </header>

                    {chartData && (
                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            {/* 1. 光谱 */}
                            <div className="canvas-card p-4">
                                <div className="flex justify-between items-center mb-2 px-2">
                                    <h3 className="text-sm font-bold text-slate-700 uppercase">Spectrum Analysis</h3>
                                    <button onClick={() => download(specRef, 'Spectrum')} className="text-slate-400 hover:text-blue-600 p-1"><Icon name="download"/></button>
                                </div>
                                <canvas ref={specRef} width={600} height={400} className="w-full h-auto"/>
                            </div>

                            {/* 2. 锥形图 */}
                            <div className="canvas-card p-4">
                                <div className="flex justify-between items-center mb-2 px-2">
                                    <h3 className="text-sm font-bold text-slate-700 uppercase">Light Cone</h3>
                                    <button onClick={() => download(coneRef, 'Cone')} className="text-slate-400 hover:text-blue-600 p-1"><Icon name="download"/></button>
                                </div>
                                <canvas ref={coneRef} width={600} height={500} className="w-full h-auto"/>
                            </div>

                            {/* 3. PPFD H1 */}
                            <div className="canvas-card p-4">
                                <div className="flex justify-between items-center mb-2 px-2">
                                    <h3 className="text-sm font-bold text-slate-700 uppercase">PPFD Map (H1)</h3>
                                    <button onClick={() => download(ppfdH1Ref, `PPFD_${chartData.h1.height}cm`)} className="text-slate-400 hover:text-blue-600 p-1"><Icon name="download"/></button>
                                </div>
                                <canvas ref={ppfdH1Ref} className="w-full h-auto border border-slate-100 rounded"/>
                            </div>

                            {/* 4. PPFD H2 */}
                            <div className="canvas-card p-4">
                                <div className="flex justify-between items-center mb-2 px-2">
                                    <h3 className="text-sm font-bold text-slate-700 uppercase">PPFD Map (H2)</h3>
                                    <button onClick={() => download(ppfdH2Ref, `PPFD_${chartData.h2.height}cm`)} className="text-slate-400 hover:text-blue-600 p-1"><Icon name="download"/></button>
                                </div>
                                <canvas ref={ppfdH2Ref} className="w-full h-auto border border-slate-100 rounded"/>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
